<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeRush — General</title>
    <link rel="stylesheet" href="STYLES.css">
    <script src="GEN.js" defer></script>
</head>
<body>
    <h1 class="title">TYPE<span>RUSH</span></h1>
    <a href="HOME.html" class="home-link">← Home</a>

    <div class="wrapper">
        <input type="text" class="input-field" placeholder="Start typing to begin the test...">
        <div class="content-box">
            <div class="typing-text">
                <p id="paragraph"></p>
            </div>
            <div class="content">
                <ul class="result-details">
                    <li class="time">
                        <p>Time Left</p>
                        <span><b>60</b>s</span>
                    </li>
                    <li class="wpm">
                        <p>WPM</p>
                        <span>0</span>
                    </li>
                    <li class="accuracy">
                        <p>Accuracy</p>
                        <span>0</span>%
                    </li>
                    <li class="error">
                        <p>Errors</p>
                        <span>0</span>%
                    </li>
                </ul>
                <button>↺ Try Again</button>
            </div>
        </div>
    </div>
</body>
</html>
